<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Meridian Network OCI observability dashboard</title>
  <desc id="desc">A stylized Meridian Network dashboard showing region coverage, topology, security posture, and deployment traceability on OCI.</desc>
  <defs>
