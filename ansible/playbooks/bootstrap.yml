---
- name: Bootstrap Meridian OCI host
  hosts: meridian
  become: true
  vars_files:
    - ../group_vars/oci.yml

  tasks:
    - name: Install base packages
      ansible.builtin.package:
        name:
          - firewalld
          - git
          - nginx
          - podman
          - python3
          - python3-pip
        state: present

    - name: Ensure runtime user exists
      ansible.builtin.user:
        name: "{{ meridian_runtime_user }}"
        system: true
        create_home: false
        shell: /sbin/nologin

    - name: Ensure Meridian directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default(meridian_runtime_user) }}"
        group: "{{ item.group | default(meridian_runtime_user) }}"
        mode: "{{ item.mode | default('0755') }}"
      loop:
        - path: "{{ meridian_app_root }}"
        - path: "{{ meridian_app_root }}/config"
          mode: "0750"
        - path: "{{ meridian_app_root }}/data"
          mode: "0750"
        - path: "{{ meridian_app_root }}/data/snapshots"
          mode: "0750"
        - path: "{{ meridian_app_root }}/logs"
          mode: "0750"
        - path: "{{ meridian_backend_root }}"
        - path: "{{ meridian_web_root }}"
          owner: nginx
          group: nginx

    - name: Resolve deployment Git revision
      ansible.builtin.command:
        cmd: git rev-parse HEAD
      args:
        chdir: "{{ playbook_dir }}/../.."
      delegate_to: localhost
      become: false
      changed_when: false
      register: meridian_deploy_revision_result

    - name: Resolve deployment build timestamp
      ansible.builtin.command:
        cmd: date -u +%Y-%m-%dT%H:%M:%SZ
      delegate_to: localhost
      become: false
      changed_when: false
      register: meridian_deploy_built_at_result

    - name: Resolve deployment working tree state
      ansible.builtin.command:
        cmd: git status --short
      args:
        chdir: "{{ playbook_dir }}/../.."
      delegate_to: localhost
      become: false
      changed_when: false
      register: meridian_deploy_status_result

    - name: Set deployment metadata facts
      ansible.builtin.set_fact:
        meridian_deploy_revision: "{{ meridian_deploy_revision_result.stdout }}"
        meridian_deploy_short_revision: "{{ meridian_deploy_revision_result.stdout[:12] }}"
        meridian_deploy_built_at: "{{ meridian_deploy_built_at_result.stdout }}"
        meridian_deploy_dirty: "{{ meridian_deploy_status_result.stdout | length > 0 }}"

    - name: Build Meridian frontend artifact
      ansible.builtin.command:
        cmd: npm --prefix frontend run build
      args:
        chdir: "{{ playbook_dir }}/../.."
      environment:
        MERIDIAN_BUILD_REVISION: "{{ meridian_deploy_revision }}"
        MERIDIAN_BUILD_SHORT_REVISION: "{{ meridian_deploy_short_revision }}"
        MERIDIAN_BUILD_BUILT_AT: "{{ meridian_deploy_built_at }}"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Read existing Meridian tenancy OCID when present
      ansible.builtin.command:
        cmd: "awk '/^MERIDIAN_TENANCY_OCID=/{sub(/^MERIDIAN_TENANCY_OCID=/, \"\"); print}' {{ meridian_app_root }}/config/meridian.env"
      register: meridian_existing_tenancy_ocid
      changed_when: false
      failed_when: false
      no_log: true

    - name: Resolve Meridian tenancy OCID for environment file
      ansible.builtin.set_fact:
        meridian_effective_tenancy_ocid: >-
          {{
            meridian_tenancy_ocid
            if (meridian_tenancy_ocid | default('') | length > 0)
            else (meridian_existing_tenancy_ocid.stdout | default(''))
          }}
      no_log: true

    - name: Write Meridian environment file
      ansible.builtin.template:
        src: ../templates/meridian.env.j2
        dest: "{{ meridian_app_root }}/config/meridian.env"
        owner: "{{ meridian_runtime_user }}"
        group: "{{ meridian_runtime_user }}"
        mode: "0640"

    - name: Reset web artifact directory
      ansible.builtin.file:
        path: "{{ meridian_web_root }}"
        state: absent

    - name: Recreate web artifact directory
      ansible.builtin.file:
        path: "{{ meridian_web_root }}"
        state: directory
        owner: nginx
        group: nginx
        mode: "0755"

    - name: Publish frontend artifact
      ansible.builtin.copy:
        src: ../../frontend/dist/
        dest: "{{ meridian_web_root }}/"
        owner: nginx
        group: nginx
        mode: preserve

    - name: Create local backend source archive
      ansible.builtin.command:
        cmd: >-
          tar
          --exclude=__pycache__
          --exclude=.pytest_cache
          --exclude=.ruff_cache
          -czf /tmp/meridian-backend.tar.gz
          -C backend .
      args:
        chdir: "{{ playbook_dir }}/../.."
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Reset backend source directory
      ansible.builtin.file:
        path: "{{ meridian_backend_root }}"
        state: absent

    - name: Recreate backend source directory
      ansible.builtin.file:
        path: "{{ meridian_backend_root }}"
        state: directory
        owner: "{{ meridian_runtime_user }}"
        group: "{{ meridian_runtime_user }}"
        mode: "0755"

    - name: Unpack Meridian backend source
      ansible.builtin.unarchive:
        src: /tmp/meridian-backend.tar.gz
        dest: "{{ meridian_backend_root }}/"
        owner: "{{ meridian_runtime_user }}"
        group: "{{ meridian_runtime_user }}"
      notify: Restart Meridian API

    - name: Remove local backend source archive
      ansible.builtin.file:
        path: /tmp/meridian-backend.tar.gz
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Create backend virtual environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ meridian_backend_venv }}"
        creates: "{{ meridian_backend_venv }}/bin/python"

    - name: Install backend Python dependencies
      ansible.builtin.pip:
        requirements: "{{ meridian_backend_root }}/requirements.txt"
        virtualenv: "{{ meridian_backend_venv }}"
      notify: Restart Meridian API

    - name: Configure Meridian API systemd service
      ansible.builtin.template:
        src: ../templates/meridian-api.service.j2
        dest: /etc/systemd/system/meridian-api.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart Meridian API

    - name: Configure Nginx for Meridian
      ansible.builtin.template:
        src: ../templates/nginx-meridian.conf.j2
        dest: /etc/nginx/conf.d/meridian.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Disable default Nginx welcome page if present
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      notify: Reload nginx

    - name: Enable firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Open web and SSH services in firewalld
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - ssh
        - http
        - https

    - name: Enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Enable Meridian API
      ansible.builtin.systemd:
        name: meridian-api
        state: started
        enabled: true
        daemon_reload: true

    - name: Flush service handlers before smoke checks
      ansible.builtin.meta: flush_handlers

    - name: Smoke check Meridian API health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ meridian_app_port }}/healthz"
        return_content: true
        status_code: 200
      register: meridian_health_check
      retries: 10
      delay: 2
      until: meridian_health_check.status == 200

    - name: Smoke check Meridian API readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ meridian_app_port }}/readyz"
        return_content: true
        status_code: 200
      register: meridian_ready_check

    - name: Smoke check Meridian preflight endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ meridian_app_port }}/api/preflight"
        return_content: true
        status_code: 200
      register: meridian_preflight_check

    - name: Smoke check Meridian API deployment version
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ meridian_app_port }}/api/version"
        return_content: true
        status_code: 200
      register: meridian_api_version_check
      failed_when: meridian_api_version_check.json.revision != meridian_deploy_revision

    - name: Smoke check dashboard contains region and topology fixes
      ansible.builtin.shell:
        cmd: >-
          grep -q availableRegions {{ meridian_web_root }}/index.html
          && grep -q effectiveSelectedRegionIds {{ meridian_web_root }}/index.html
          && grep -q topologyScopedData {{ meridian_web_root }}/index.html
          && grep -q meridian-build-revision {{ meridian_web_root }}/index.html
      changed_when: false

    - name: Smoke check deployed frontend version
      ansible.builtin.slurp:
        src: "{{ meridian_web_root }}/version.json"
      register: meridian_frontend_version_file
      failed_when: >-
        (meridian_frontend_version_file.content | b64decode | from_json).revision != meridian_deploy_revision

    - name: Smoke check dashboard cache headers
      ansible.builtin.uri:
        url: "http://127.0.0.1/index.html"
        method: HEAD
        status_code: 200
      register: meridian_index_head
      failed_when: "'no-cache' not in (meridian_index_head.cache_control | default(''))"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Meridian API
      ansible.builtin.service:
        name: meridian-api
        state: restarted

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
