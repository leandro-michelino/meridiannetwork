name: validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -recursive -check

      - name: Terraform init without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible

      - name: Install collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax check
        run: |
          printf '[meridian]\nlocalhost ansible_connection=local\n' > /tmp/meridian_inventory
          ansible-playbook --syntax-check -i /tmp/meridian_inventory ansible/playbooks/bootstrap.yml

